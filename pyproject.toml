[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "online-shopping-system-malaysia"
version = "0.1.0"
description = "Local-first shopping assistant for TikTok Shop, Shopee, and Lazada in Malaysia."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "appium-python-client>=5.1.0",
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "keyring>=25.6.0",
    "lxml>=6.0.0",
    "playwright>=1.54.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
    "uiautomator2>=3.3.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
oss-my = "oss_my.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
